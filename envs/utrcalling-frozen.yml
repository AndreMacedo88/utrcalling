# Frozen utrcalling environment: exact versions, verified by creating this
# environment from scratch and passing the full test suite on linux-64
# (2026-11-05, utrcalling 4.0.0). Use it when the regular environment.yml no
# longer resolves to a working set of packages, e.g. after breaking releases of
# dependencies years from now. From the repository root:
#
#   conda env create -f envs/utrcalling-frozen.yml
#   conda activate utrcalling
#   pip install --group test && pytest
#
# Add `-n <name>` to `conda env create` to use another environment name.
#
# Python packages are pinned exactly; conda packages by version rather than by
# build, so conda can still pick compatible builds of their system libraries.
# Every pin installs from a pre-built wheel except gtfparse (pure Python), so
# no compiler is needed: a pin that compiles at install time breaks as
# toolchains change (e.g. pybedtools 0.12.0 has no wheels; 0.12.1 does).
#
# To refresh: in an environment where the tests pass, resolve utrcalling's
# dependency closure constrained to that environment's versions, check that
# each pin has a wheel, paste the pins below, then rebuild and re-test:
#
#   pip list --format=freeze | grep -v '^utrcalling' > constraints.txt
#   pip install --dry-run --ignore-installed --report closure.json -c constraints.txt .
#   pip install --dry-run --only-binary=:all: --no-deps --ignore-installed <pin>  # per pin
name: utrcalling
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.13
  - bedtools=2.31.1
  - pip=26.0.1
