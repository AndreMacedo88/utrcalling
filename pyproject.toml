[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B905",   # zip without strict (Python 3.9 compat)
    "SIM108", # use ternary operator (reduces readability in bioinformatics code)
    "RUF001", # ambiguous unicode character
    "RUF002", # ambiguous unicode character in docstring
    "UP007",  # Use X | Y for union types (Python 3.9 compat)
]

[tool.ruff.lint.per-file-ignores]
"utrcalling/tests/*" = ["F401", "E402"]  # unused imports and import order in tests

[tool.ruff.lint.isort]
known-first-party = ["utrcalling"]