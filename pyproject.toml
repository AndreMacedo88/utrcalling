[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "utrcalling"
dynamic = ["version"]
description = "Package with tools to calculate molecule UTR sizes from RNA sequencing reads."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "André Lopes Martins Macedo", email = "andre.lopes.macedo@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# Compatible ranges, so utrcalling can share an environment with other tools.
# Upper bounds only where a release breaks utrcalling or is not yet validated.
# The exact versions the test suite passes with are in envs/utrcalling-frozen.yml.
dependencies = [
    "numpy>=1.22.3",
    "pandas>=1.3.0,<3",  # tests pass on pandas 3; cap until outputs are validated on real data
    "scipy>=1.6.2",
    "scikit-learn>=0.23.2",
    "regex>=2022.04.24",
    "rapidfuzz>=3.1.0",  # Hamming distance with pad
    "joblib>=1.0.1",
    "anndata>=0.12.0",
    "scanpy>=1.11.0",
    "gtfparse>=1.2.1,<2",  # gtfparse 2 returns polars DataFrames
    "pyarrow",
    "pysam>=0.20.0",
    "pybedtools>=0.8.2",
    "tqdm>=4.59.0",
    "bidict>=0.22.0",
    "psutil",
    "pympler",
    "coloredlogs",
    "verboselogs",
    "colorama",
    "cyclopts>=5.3,<6",  # the command line; a major version changes how command lines parse
]

[project.urls]
Homepage = "https://github.com/AndreMacedo88/utrcalling"

[project.scripts]
utrcalling = "utrcalling.runtime:main"

# Development tools, not installed for users. `pip install --group test` for
# running the tests, `pip install --group dev` for everything.
# Pinned because their verdicts (formatting, type errors) change between releases.
[dependency-groups]
test = ["coverage==7.17.1", "pytest==9.2.0"]
dev = [{ include-group = "test" }, "mypy==2.4.1", "ruff==0.17.3"]

[tool.setuptools.dynamic]
version = { attr = "utrcalling._metadata.__version__" }

[tool.setuptools.packages.find]
include = ["utrcalling*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]  # exploratory analyses, kept as written

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "ANN",  # type annotations on every function signature (library code only)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # use ternary operator (reduces readability in bioinformatics code)
    "RUF001", # ambiguous unicode character
    "RUF002", # ambiguous unicode character in docstring
]

[tool.ruff.lint.per-file-ignores]
# Tests: unused imports, import order, and no required annotations.
"utrcalling/tests/*" = ["F401", "E402", "ANN"]

[tool.ruff.lint.flake8-annotations]
# *args/**kwargs that are passed straight through to another callable.
allow-star-arg-any = true

[tool.ruff.lint.isort]
known-first-party = ["utrcalling"]

[tool.pytest]
minversion = "9.0"
testpaths = ["utrcalling/tests"]
# importlib: several test folders hold a test_utr_mapping.py, and folder names
# such as test_3'10x are not valid package names.
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
filterwarnings = [
    # Deprecations triggered by utrcalling's own code fail the run: they flag
    # behaviour that changes in upcoming dependency releases (e.g. pandas 3).
    # pandas and anndata attribute these warnings to the calling module.
    'error::DeprecationWarning:utrcalling\.',
    'error::FutureWarning:utrcalling\.',
]

[tool.coverage.run]
branch = true
source = ["utrcalling"]
# Profiling scripts for developers, not part of what utrcalling does.
omit = ["*/utrcalling/tests/*", "*/utrcalling/performance/*"]
# Also measure the joblib worker processes, which run most of the mapping and
# peak calling. Each process writes its own data file: `coverage combine`.
patch = ["subprocess"]
parallel = true
sigterm = true

[tool.coverage.report]
# Every line and branch: test new code, or delete it if nothing can reach it.
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", 'if __name__ == "__main__":']

[tool.mypy]
files = ["utrcalling"]
exclude = ["^utrcalling/tests/"]
python_version = "3.11"
# Most scientific dependencies ship no type information (pandas without
# pandas-stubs, anndata internals, pybedtools, gtfparse): treat them as Any.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
