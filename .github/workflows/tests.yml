name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run: environment.yml resolves the latest compatible dependencies, so
  # this catches breaking upstream releases (like pandas 3) before users do.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff (pinned in the dev dependency group)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - run: ruff format --check .
      - run: ruff check --output-format github .

  # The documentation, as Read the Docs builds it: warnings fail, so broken
  # links and references show here first.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install utrcalling and the documentation tools (pinned in the docs group)
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group docs
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html

  # The release workflow builds the package the same way, from a commit that passed
  # CI: a package that fails to build or whose PyPI page is broken fails here first.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the build tools
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Build the source distribution and the wheel
        run: python -m build
      - name: Check that PyPI can show the README
        run: python -m twine check --strict dist/*
      # As `pip install utrcalling` does: the wheel's dependencies and command.
      - name: Install the wheel and run the command
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP" && utrcalling --version
      # Files that are not Python modules ship only if MANIFEST.in lists them.
      - name: Check that the wheel has the R script of the DRIMSeq engine
        run: |
          cd "$RUNNER_TEMP"
          python -c "from utrcalling.core.stats import drimseq; assert drimseq.SCRIPT.is_file()"

  # The DRIMSeq engine of `stats site-usage` against real R and DRIMSeq, which
  # are optional and which the other jobs replace with a stand-in. Installed as
  # the documentation tells users to.
  drimseq:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
      - name: Create the environment, with R and DRIMSeq
        run: |
          conda env create -n utrcalling -f environment.yml
          conda install -y -n utrcalling -c conda-forge -c bioconda r-base bioconductor-drimseq
      - name: Install the test tools (pinned in the test dependency group)
        run: conda run -n utrcalling python -m pip install --group test
      # Fail, rather than skip the tests, if R cannot load DRIMSeq.
      - name: Check that R loads DRIMSeq
        run: conda run -n utrcalling Rscript -e 'library(DRIMSeq); packageVersion("DRIMSeq")'
      - name: Run the tests of the statistics
        run: conda run --no-capture-output -n utrcalling pytest utrcalling/tests/test_stats -rs

  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: environment.yml
            environment-file: environment.yml
          # The oldest Python that utrcalling supports, and the newest ones, with
          # the latest compatible dependencies, as environment.yml resolves them.
          - name: Python 3.11
            environment-file: environment.yml
            python: "3.11"
          - name: Python 3.13
            environment-file: environment.yml
            python: "3.13"
          - name: Python 3.14
            environment-file: environment.yml
            python: "3.14"
          - name: envs/utrcalling-frozen.yml
            environment-file: envs/utrcalling-frozen.yml
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
      - name: Use Python ${{ matrix.python }}
        if: matrix.python
        run: sed -i "s/^  - python=.*/  - python=${{ matrix.python }}/" environment.yml
      # The same command users run, so the install instructions are tested too.
      - name: Create the environment
        run: conda env create -n utrcalling -f ${{ matrix.environment-file }}
      - name: Show the resolved versions
        run: conda run -n utrcalling pip list
      - name: Install the test tools (pinned in the test dependency group)
        run: conda run -n utrcalling python -m pip install --group test
      - name: Run the test suite
        if: matrix.environment-file != 'envs/utrcalling-frozen.yml'
        run: conda run --no-capture-output -n utrcalling pytest
      # Coverage only against the frozen versions, like mypy below: the result then
      # changes only when the code or the tests change.
      - name: Run the test suite with branch coverage
        if: matrix.environment-file == 'envs/utrcalling-frozen.yml'
        run: |
          conda run --no-capture-output -n utrcalling coverage run -m pytest
          conda run -n utrcalling coverage combine -q
          conda run -n utrcalling coverage xml -q --fail-under=0
      # Before the 100% check below, so Codecov also records a drop.
      - name: Upload the coverage to Codecov
        if: matrix.environment-file == 'envs/utrcalling-frozen.yml'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
      - name: Require full branch coverage (fail_under in pyproject.toml)
        if: matrix.environment-file == 'envs/utrcalling-frozen.yml'
        run: conda run --no-capture-output -n utrcalling coverage report
      # Only against the frozen versions: numpy and pysam ship the type stubs, so
      # the result then changes only when the code or the pins change.
      - name: Type-check the library with mypy
        if: matrix.environment-file == 'envs/utrcalling-frozen.yml'
        run: |
          conda run -n utrcalling python -m pip install --group dev
          conda run --no-capture-output -n utrcalling mypy
