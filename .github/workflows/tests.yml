name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run: environment.yml resolves the latest compatible dependencies, so
  # this catches breaking upstream releases (like pandas 3) before users do.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff (pinned in the dev dependency group)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - run: ruff format --check .
      - run: ruff check --output-format github .

  tests:
    name: tests (${{ matrix.environment-file }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        environment-file: [environment.yml, envs/utrcalling-frozen.yml]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
      # The same command users run, so the install instructions are tested too.
      - name: Create the environment
        run: conda env create -n utrcalling -f ${{ matrix.environment-file }}
      - name: Show the resolved versions
        run: conda run -n utrcalling pip list
      - name: Install the test tools (pinned in the test dependency group)
        run: conda run -n utrcalling python -m pip install --group test
      - name: Run the test suite
        if: matrix.environment-file != 'envs/utrcalling-frozen.yml'
        run: conda run --no-capture-output -n utrcalling pytest
      # Coverage only against the frozen versions, like mypy below: the result then
      # changes only when the code or the tests change. Fails below 100% (fail_under).
      - name: Run the test suite with branch coverage
        if: matrix.environment-file == 'envs/utrcalling-frozen.yml'
        run: |
          conda run --no-capture-output -n utrcalling coverage run -m pytest
          conda run -n utrcalling coverage combine -q
          conda run --no-capture-output -n utrcalling coverage report
      # Only against the frozen versions: numpy and pysam ship the type stubs, so
      # the result then changes only when the code or the pins change.
      - name: Type-check the library with mypy
        if: matrix.environment-file == 'envs/utrcalling-frozen.yml'
        run: |
          conda run -n utrcalling python -m pip install --group dev
          conda run --no-capture-output -n utrcalling mypy
