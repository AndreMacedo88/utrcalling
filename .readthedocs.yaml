# Read the Docs builds the documentation (docs/) at every push to main (the
# "latest" version) and at every release tag (the "stable" version):
# https://utrcalling.readthedocs.io
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install --upgrade pip
      - python -m pip install . --group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
